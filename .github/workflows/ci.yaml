name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        # with:
        #   node-version: 22
        #   cache: pn
      - name: Install dependencies
        run: pn i
      - name: Build
        run: pn build
